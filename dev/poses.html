<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gino poses</title>
<link rel="stylesheet" href="../src/card.css">
<style>
  body { margin: 0; padding: 24px; background: #F4F7F1; font: 14px "Segoe UI", system-ui, sans-serif; color: #2E3327; }
  .grid { display: grid; grid-template-columns: repeat(5, 200px); gap: 16px; }
  figure { margin: 0; background: #fff; border: 1px solid #D5DECF; border-radius: 14px; padding: 12px; text-align: center; }
  figure svg { width: 160px; height: 187px; }
  body.static .gino * { animation: none !important; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script src="../src/gino.js"></script>
<script>
  if (location.search.includes('static')) document.body.classList.add('static');
  const grid = document.getElementById('grid');
  for (const p of Gino.poses) {
    const f = document.createElement('figure');
    f.innerHTML = Gino.svg(p) + `<figcaption>${p}</figcaption>`;
    grid.appendChild(f);
  }
</script>
</body>
</html>
