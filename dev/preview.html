<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gino card states</title>
<style>
  body { margin: 0; padding: 0; background: #5B6B7A; font: 13px system-ui, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(3, 440px); }
  iframe { width: 440px; height: 300px; border: 0; display: block; }
</style>
</head>
<body>
<!-- Open in a browser started with --disable-web-security (file:// frames are cross-origin otherwise).
     ?still freezes all motion, so Gino shows where each move ends rather than mid-move.
     The stretches and the card come from build/: run npm run build first. -->
<div class="grid" id="grid"></div>
<script src="../build/exercises.js"></script>
<script>
  const byId = (id) => GinoExercises.EXERCISES.find((e) => e.id === id);
  const ex = {
    chin: byId('chin-tucks'),
    neck: byId('neck-side'),
    thor: byId('thoracic'),
    rolls: byId('shoulder-rolls'),
    walk: byId('walkaround'),
    welcome: { id: 'welcome', name: "Hi, I'm Gino", pose: 'wave', text: "Every 20 minutes of screen time I'll pop up with a short stretch. I live in the tray by the clock. If you can't see me, I'm under the ^ arrow: drag me out.", dose: '', howTo: [] },
  };
  const base = { todayCount: 2, snoozeMin: 10, intervalMin: 20, autoSnoozeMin: 0 };
  const scenes = [
    ['prompt: Gino demos one rep', (c) => c.show({ ...base, exercise: ex.chin })],
    ['howto', (c) => { c.show({ ...base, exercise: ex.neck }); c.toggleHowTo(); }],
    ['get ready', (c) => { c.show({ ...base, exercise: ex.chin }); c.start(); c.jumpTo(0); }],
    ['rep: hold', (c) => { c.show({ ...base, exercise: ex.chin }); c.start(); c.jumpTo(3, 1); }],
    ['rep: arch back', (c) => { c.show({ ...base, exercise: ex.thor }); c.start(); c.jumpTo(4, 0); }],
    ['rep: squeeze back', (c) => { c.show({ ...base, exercise: ex.rolls }); c.start(); c.jumpTo(7, 1); }],
    ['active sides', (c) => { c.show({ ...base, exercise: ex.neck }); c.start(); c.jumpTo(2); }],
    ['active walk', (c) => { c.show({ ...base, todayCount: 0, exercise: ex.walk }); c.start(); c.setElapsed(40); }],
    ['done', (c) => { c.show({ ...base, exercise: ex.chin }); c.finish(); }],
    ['snoozed', (c) => { c.show({ ...base, exercise: ex.chin }); c.snooze(false); }],
    ['welcome', (c) => c.show({ ...base, mode: 'welcome', exercise: ex.welcome })],
    ['first today', (c) => c.show({ ...base, todayCount: 0, exercise: ex.walk })],
  ];
  const grid = document.getElementById('grid');
  for (const [name, run] of scenes) {
    const f = document.createElement('iframe');
    f.title = name;
    f.src = '../src/card.html';
    f.onload = () => {
      // ?still freezes all motion so screenshots show the settled layout
      if (location.search.includes('still')) {
        const s = f.contentDocument.createElement('style');
        s.textContent = '*, *::before, *::after { animation: none !important; transition: none !important; }';
        f.contentDocument.head.appendChild(s);
      }
      run(f.contentWindow.__card);
    };
    grid.appendChild(f);
  }
</script>
</body>
</html>
