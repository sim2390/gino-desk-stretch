# Checks every pull request and every push to main: the types and the tests
# (the TypeScript build, then the Rust unit tests). It can also be run on any
# branch from the Actions tab ("Run workflow").
# The installers are built separately, by build.yml.
name: Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # Windows, where most of Gino's platform code runs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Keeps the compiled Rust dependencies between runs; the first build of
      # Tauri takes several minutes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: npm test
      # After npm test, which builds the card files the Rust side compiles in.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
