[package]
name = "gino"
version = "0.3.0"
description = "Gino Desk Stretch: a desk stretch coach that lives in your tray"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "gino_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind, not abort: the timer loop catches a panic and carries on, and a lock held during one
# is recovered. With abort, any panic would quit Gino.
panic = "unwind"
strip = true
